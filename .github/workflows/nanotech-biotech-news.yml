# Refresh Nanotech Insights news every 6 hours.
# Writes nanotech/data/biotech-news.json from public RSS / PubMed sources.
# The live Cursor app can pick up fresher JSON via GitHub raw; GitHub Pages
# readers get the committed file on the next Pages build / clone.

name: Nanotech biotech news (6h)

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "nanotech/scripts/fetch_biotech_news.py"
      - ".github/workflows/nanotech-biotech-news.yml"

permissions:
  contents: write

concurrency:
  group: nanotech-biotech-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: python3 nanotech/scripts/fetch_biotech_news.py

      - name: Commit feed if changed
        run: |
          if git diff --quiet -- nanotech/data/biotech-news.json; then
            echo "No news feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nanotech/data/biotech-news.json
          git commit -m "chore(nanotech): refresh biotech news feed"
          git push
